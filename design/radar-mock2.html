<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>示意 · 風險雷達 v2</title><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../design-tokens.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--ym-bg);color:var(--ym-text);font:14px/1.5 var(--ym-font-ui)}
.wrap{padding:28px 32px;display:flex;gap:40px;align-items:flex-start}
h1{font-size:18px;margin:0 0 4px}.lead{color:var(--ym-text-muted);font-size:13px;margin:0 0 18px;max-width:560px}
.card{width:300px;background:var(--ym-surface-1);border:1px solid var(--ym-line);border-radius:8px;padding:12px 0 6px}
.card h2{margin:0;padding:0 14px 6px;font-size:14px;font-weight:600}
.ic{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:700}
.c-crit{color:#fff;background:color-mix(in srgb,var(--ym-risk-crit) 20%,transparent)}
.c-mid{color:color-mix(in srgb,var(--ym-risk-mid) 70%,white);background:color-mix(in srgb,var(--ym-risk-mid) 14%,transparent)}
.c-low{color:color-mix(in srgb,var(--ym-risk-low) 70%,white);background:color-mix(in srgb,var(--ym-risk-low) 14%,transparent)}
.c-none{color:var(--ym-text-muted);background:var(--ym-surface-3)}
.box{position:relative;width:100%;aspect-ratio:1}.box>svg{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.2}
.tag.above{transform:translate(-50%,-100%);align-items:center}.tag.below{transform:translate(-50%,0);align-items:center}
.tag.side-l{transform:translate(0,-50%);align-items:flex-start}.tag.side-r{transform:translate(-100%,-50%);align-items:flex-end}
.tag .n{display:inline-flex;align-items:center;gap:4px}
.sweep{position:absolute;left:50%;top:50%;width:50%;height:50%;margin:-25% 0 0 -25%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 300deg,color-mix(in srgb,var(--ym-accent) 0%,transparent) 300deg,color-mix(in srgb,var(--ym-accent) 26%,transparent) 360deg);animation:spin 6s linear infinite;pointer-events:none}

@keyframes spin{to{transform:rotate(360deg)}}
.dot{fill:var(--ym-accent);stroke:#101010;stroke-width:1.2}
